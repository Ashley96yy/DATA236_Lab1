# API Gateway — routes /api/v1/* to the appropriate backend microservice.
# Services mount their routers at /api/v1/ so no URI rewriting is needed.

server {
    listen 8000;
    server_name _;
    resolver 127.0.0.11 valid=10s;

    # ── Owner auth — must be matched before the /api/v1/auth/ block ─────────
    location /api/v1/auth/owner {
        set $backend       http://owner-service:8002;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── User auth ────────────────────────────────────────────────────────────
    location /api/v1/auth {
        set $backend       http://user-service:8001;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Users (profile, preferences, favorites, history) ────────────────────
    location /api/v1/users {
        set $backend       http://user-service:8001;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/v1/ai-assistant {
        set $backend       http://user-service:8001;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Favorites shortcut used by the frontend (/favorites/{id}) ───────────
    location /api/v1/favorites {
        set $backend       http://user-service:8001;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Owner profile & dashboard ────────────────────────────────────────────
    location /api/v1/owners {
        set $backend       http://owner-service:8002;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/v1/owner {
        set $backend       http://owner-service:8002;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Review writes: PUT/DELETE /api/v1/reviews/{id} ──────────────────────
    location ~ ^/api/v1/reviews/ {
        set $backend       http://review-api-service:8004;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Restaurant reviews: GET → restaurant-service, POST → review-api ──────
    # (regex location, more specific than the prefix block below)
    # Uses Docker's embedded DNS resolver so variable proxy_pass resolves correctly.
    location ~ ^/api/v1/restaurants/[0-9]+/reviews(/?)$ {
        # Default to restaurant-service for reads; POST goes to review-api
        set $backend http://restaurant-service:8003;
        if ($request_method = POST) {
            set $backend http://review-api-service:8004;
        }
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Restaurants (list, create, detail, photos) ───────────────────────────
    location /api/v1/restaurants {
        set $backend       http://restaurant-service:8003;
        proxy_pass         $backend$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Gateway health check ─────────────────────────────────────────────────
    location /health {
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # ── Fallback ─────────────────────────────────────────────────────────────
    location / {
        return 404 '{"detail":"Not found"}';
        add_header Content-Type application/json;
    }
}
