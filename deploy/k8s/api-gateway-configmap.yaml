apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: yelp-lab2
data:
  default.conf: |
    server {
        listen 8000;
        server_name _;
        resolver 127.0.0.11 valid=10s;

        location /api/v1/auth/owner {
            set $backend       http://owner-service:8002;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/auth {
            set $backend       http://user-service:8001;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/users {
            set $backend       http://user-service:8001;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/ai-assistant {
            set $backend       http://user-service:8001;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/favorites {
            set $backend       http://user-service:8001;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/owners {
            set $backend       http://owner-service:8002;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/owner {
            set $backend       http://owner-service:8002;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/v1/reviews/ {
            set $backend       http://review-api-service:8004;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/v1/restaurants/[0-9]+/reviews(/?)$ {
            set $backend http://restaurant-service:8003;
            if ($request_method = POST) {
                set $backend http://review-api-service:8004;
            }
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/restaurants {
            set $backend       http://restaurant-service:8003;
            proxy_pass         $backend$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location / {
            return 404 '{"detail":"Not found"}';
            add_header Content-Type application/json;
        }
    }
